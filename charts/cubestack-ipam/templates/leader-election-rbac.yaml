{{- if and .Values.rbac.create .Values.leaderElection.enabled }}
{{/*
  Leader election needs a named lease, and the binary's LeaderElectionID is fixed
  at e0485e51.cubestack.io, so this cannot be templated per release. Namespaced Role
  and RoleBinding, so two releases in different namespaces do not contend.

  events create/patch is here rather than in the ClusterRole set above because leader
  election emits them; the controllers' own events are covered by the ClusterRole.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cubestack-ipam.fullname" . }}-leader-election-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cubestack-ipam.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cubestack-ipam.fullname" . }}-leader-election-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cubestack-ipam.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cubestack-ipam.fullname" . }}-leader-election-role
subjects:
- kind: ServiceAccount
  name: {{ include "cubestack-ipam.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
