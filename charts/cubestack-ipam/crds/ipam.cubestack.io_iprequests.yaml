---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: iprequests.ipam.cubestack.io
spec:
  group: ipam.cubestack.io
  names:
    kind: IPRequest
    listKind: IPRequestList
    plural: iprequests
    singular: iprequest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.poolRef
      name: Pool
      type: string
    - jsonPath: .status.assignedIP
      name: Assigned
      type: string
    - jsonPath: .spec.nad
      name: NAD
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: IPRequest is the Schema for the iprequests API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of IPRequest
            properties:
              nad:
                description: |-
                  nad optionally names the NetworkAttachmentDefinition to mint for this claim,
                  in the IPRequest's own namespace. The generated NAD takes this name verbatim,
                  which is what lets a VM manifest be written before the request is satisfied —
                  the VM references the NAD by a name it already knows.

                  Omit it for a ledger-only claim: an address is bound and nothing is created.
                  The referenced pool must carry a nadTemplate, otherwise the claim fails with
                  a TemplateMissing condition.
                maxLength: 253
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              poolRef:
                description: |-
                  poolRef names the IPPool to claim from. IPPool is cluster-scoped, so this is
                  a bare name with no namespace.
                minLength: 1
                type: string
            required:
            - poolRef
            type: object
          status:
            description: status defines the observed state of IPRequest
            properties:
              assignedIP:
                description: assignedIP is the address this claim holds, once bound.
                type: string
              conditions:
                description: |-
                  conditions represent the current state of the IPRequest resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Condition types set here:
                  - "Ready": True once an address is assigned and, if spec.nad was set, its NAD exists.
                    The cause of a False goes in the condition's reason, e.g. "RangeExhausted" or
                    "PoolNotFound" -- there is no separate "Degraded" type, which would be its exact
                    complement and could drift out of step with it.
                  - "TemplateMissing": True when spec.nad is set but the pool carries no nadTemplate,
                    so no NAD can be minted. Names a misconfiguration the user can fix.
                  - "NADNameTaken": True when the name in spec.nad is already held by an object this
                    claim does not own. Such an object is never adopted or overwritten.

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              phase:
                description: phase summarises the claim's lifecycle.
                enum:
                - Pending
                - Bound
                - Failed
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
