---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: ippools.ipam.cubestack.io
spec:
  group: ipam.cubestack.io
  names:
    kind: IPPool
    listKind: IPPoolList
    plural: ippools
    singular: ippool
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nadTemplate.subnet
      name: Subnet
      type: string
    - jsonPath: .spec.range.start
      name: Start
      type: string
    - jsonPath: .spec.range.end
      name: End
      type: string
    - jsonPath: .spec.nadTemplate.gateway
      name: Gateway
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: IPPool is the Schema for the ippools API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of IPPool
            properties:
              nadTemplate:
                description: |-
                  nadTemplate is the network config cloned into every NAD this pool mints,
                  including the addressing that config carries.

                  Optional, because a pool need not serve claims that ask for a NAD. A claim
                  that sets IPRequest.spec.nad against a pool with no template fails with a
                  TemplateMissing condition rather than silently binding without a network.

                  Its fields (subnet, gateway, bridge) are required whenever the template is
                  present, so there is no half-specified template to reason about and no
                  cross-field rule needed to enforce that: the field list IS the rule.
                properties:
                  bridge:
                    description: bridge is the linux bridge the VM's interface is
                      enslaved to, e.g. "br0".
                    minLength: 1
                    type: string
                  dns:
                    description: dns is handed to the guest alongside its address.
                    properties:
                      domain:
                        description: domain is the local domain the guest resolves
                          within.
                        type: string
                      nameservers:
                        description: nameservers is the list of resolvers.
                        items:
                          type: string
                        type: array
                      search:
                        description: search is the list of search domains.
                        items:
                          type: string
                        type: array
                    type: object
                  gateway:
                    description: |-
                      gateway is the default gateway handed to VMs whose address comes from this
                      pool. It must sit inside subnet — a bridge binding needs it on the same L2 —
                      and outside the allocatable range in IPPool.spec.range.
                    pattern: ^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$
                    type: string
                  macspoofchk:
                    description: macspoofchk enables MAC spoof checking on the interface.
                    type: boolean
                  routes:
                    description: routes are injected into the guest alongside the
                      default gateway.
                    items:
                      description: NADRoute is a route injected into the guest.
                      properties:
                        dst:
                          description: dst is the destination CIDR, e.g. "0.0.0.0/0".
                          minLength: 1
                          type: string
                        gw:
                          description: gw is the next hop. Omit to route via the interface's
                            own gateway.
                          type: string
                      required:
                      - dst
                      type: object
                    type: array
                  subnet:
                    description: |-
                      subnet is the CIDR the minted NAD draws from, e.g. "10.66.3.0/24". It becomes
                      ipam.range in the generated config.

                      This is not the allocatable band — that is IPPool.spec.range, which must lie
                      within this subnet. Several pools may share one subnet as long as their bands
                      are disjoint.
                    pattern: ^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])/(3[0-2]|[12]?[0-9])$
                    type: string
                  type:
                    default: cnv-bridge
                    description: |-
                      type is the CNI plugin type. cnv-bridge is the linux bridge binding used on
                      this cluster's underlay.
                    enum:
                    - cnv-bridge
                    - bridge
                    type: string
                  vlan:
                    description: |-
                      vlan is the VLAN id, when the bridge is VLAN-filtered. Omit for an untagged
                      bridge.
                    format: int32
                    maximum: 4094
                    minimum: 0
                    type: integer
                required:
                - bridge
                - gateway
                - subnet
                type: object
              range:
                description: |-
                  range is the inclusive band of addresses available to IPRequest claims.
                  It must not overlap any other NAD serving the same subnet. Regular users
                  cannot create NADs, so this is an admin responsibility rather than something
                  the controller can observe — see the README.

                  This is the only required field. A pool with no nadTemplate allocates
                  addresses and mints nothing, so it needs no subnet and no gateway.
                properties:
                  end:
                    description: end is the last address in the band (inclusive).
                    pattern: ^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$
                    type: string
                  start:
                    description: start is the first address in the band (inclusive).
                    pattern: ^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$
                    type: string
                required:
                - end
                - start
                type: object
            required:
            - range
            type: object
            x-kubernetes-validations:
            - message: range.start must lie within the nadTemplate subnet
              rule: '!has(self.nadTemplate) || cidr(self.nadTemplate.subnet).containsIP(ip(self.range.start))'
            - message: range.end must lie within the nadTemplate subnet
              rule: '!has(self.nadTemplate) || cidr(self.nadTemplate.subnet).containsIP(ip(self.range.end))'
          status:
            description: status defines the observed state of IPPool
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the IPPool resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Condition types set here:
                  - "Available": True when the pool is usable -- its range parses, and, when it
                    has a nadTemplate, that template's subnet and gateway are coherent with the
                    range. A False carries the cause in its reason, e.g. "RangeInvalid"; there is
                    no separate "Degraded" type, which would be its exact complement.

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
