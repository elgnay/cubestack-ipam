apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: cubestack6
  namespace: default
  labels:
    # Cluster convention, used for per-owner querying and cleanup:
    #   kubectl get vm -l owner=<username>
    # Must be a legal label value -- no angle brackets.
    owner: change-me
  annotations:
    # The trigger. A VirtualMachine without this annotation is left alone entirely.
    #
    # Controller #2 reads it and creates an IPRequest named <vm-name>-ip in this
    # namespace, owned by this VM. Controller #1 then allocates an address and
    # mints the NAD named below. Neither controller ever patches the VM.
    ipam.cubestack.io/pool: cubestack-static-v4

    # Optional. The NAD to mint; it defaults to <vm-name>-static, which is
    # "cubestack6-static" here. Set it only when you want a different name.
    ipam.cubestack.io/nad-name: cubestack6-static
spec:
  runStrategy: Always
  dataVolumeTemplates:
    # Root-disk PVC names must be unique within the namespace: this becomes the
    # PVC name verbatim.
    - metadata:
        name: cubestack6-rootdisk
      spec:
        source:
          pvc:
            name: ubuntu-22.04-server-amd64-img
            namespace: default
        storage:
          # RWX + Block. RWX is what live migration needs: the target pod attaches
          # the same disk from another node while the source is still running, so a
          # RWO volume would fail the migration. It is also what makes the disk
          # independent of the node in general -- the VM can be stopped and started
          # elsewhere and an unplanned node loss does not take the data with it.
          # Block mode skips the filesystem layer KubeVirt does not need here.
          accessModes:
            - ReadWriteMany
          storageClassName: ceph-rbd-kubevirt
          volumeMode: Block
          resources:
            requests:
              storage: 20Gi
  template:
    metadata:
      labels:
        kubevirt.io/domain: cubestack6
    spec:
      # Deliberately left at its default (LiveMigrate) rather than pinned. This
      # sample claims from a pool whose ipam is static, and a static address is held
      # by the target pod and the source pod at the same time -- which is exactly
      # what migration needs, so the VM can be moved off a node for a drain or a
      # patch without an outage.
      #
      # `evictionStrategy: None` is the thing to reach for if this VM is ever moved
      # to a pool with ipam: whereabouts. There the address is leased and the ledger
      # has one slot per address, so the second CNI ADD is refused and the VMIM sits
      # in Scheduling forever (measured 2026-09-28: "Could not allocate IP in range:
      # ip: 10.66.3.221 / - 10.66.3.221"). None keeps KubeVirt from offering the VM
      # for migration on every drain, which leaves stop/start as the only way to
      # move it -- the honest cost of that mode.
      #
      # Whichever way it is set, the field sits under template.spec, NOT at
      # spec.evictionStrategy. KubeVirt's CRD is structural, so a wrong field name is
      # silently pruned by the apiserver rather than rejected, and you get no warning
      # at all -- check with `kubectl get vm -o jsonpath` that it actually landed.
      nodeSelector:
        kubevirt.io/subnet: 10-66-3-0
      domain:
        cpu:
          cores: 4
        # Required. KubeVirt's admission webhook rejects a VMI with no memory
        # declared -- one of spec.domain.memory.guest,
        # spec.domain.memory.hugepages.pageSize or
        # spec.domain.resources.requests.memory must be set.
        resources:
          requests:
            memory: 8Gi
        devices:
          disks:
            - disk:
                bus: virtio
              name: rootdisk
            - disk:
                bus: virtio
              name: cloudinitdisk
          interfaces:
            # The name here is local to this manifest; the reference that matters
            # is networks[].multus.networkName below.
            - name: underlay
              bridge: {}
      networks:
        - name: underlay
          multus:
            # Must match ipam.cubestack.io/nad-name, or the default <vm-name>-static.
            # Multus resolves this at pod-sandbox creation, so the VM will sit in
            # FailedCreatePodSandBox for the few seconds until the claim has minted
            # it. That is expected, not a failure to investigate.
            networkName: default/cubestack6-static
      volumes:
        - name: rootdisk
          dataVolume:
            name: cubestack6-rootdisk
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              users:
                - name: ubuntu
                  sudo: ALL=(ALL) NOPASSWD:ALL
                  shell: /bin/bash
                  lock_passwd: false
                  # NOT plaintext -- a crypt hash. macOS:
                  #   openssl passwd -1 '<pw>'   (LibreSSL has no -6)
                  # Linux: openssl passwd -6 '<pw>'. Quote it: the hash contains $.
                  passwd: "<hash>"
              ssh_pwauth: true
              chpasswd:
                expire: false
            # The NAD's DNS does NOT reach the guest -- the interface is on DHCP,
            # which KubeVirt answers on the virt-launcher side, but nameservers
            # have to be declared here or the VM has no DNS.
            networkData: |
              version: 2
              ethernets:
                all-en:
                  match: { name: "en*" }
                  dhcp4: true
                  nameservers:
                    addresses: [223.5.5.5, 8.8.8.8]
