---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ipam.cubestack.io
  resources:
  - ippools
  - iprequests
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ipam.cubestack.io
  resources:
  - ippools/finalizers
  - iprequests/finalizers
  verbs:
  - update
- apiGroups:
  - ipam.cubestack.io
  resources:
  - ippools/status
  - iprequests/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - k8s.cni.cncf.io
  resources:
  - network-attachment-definitions
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
