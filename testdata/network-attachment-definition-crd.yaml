# A minimal NetworkAttachmentDefinition CRD, for envtest only.
#
# Multus's real CRD carries spec.config as a string and nothing else that this
# project touches, so this is a faithful enough copy to test against: the
# controllers set spec.config and read it back, and a schema that accepted
# anything would let a renderer bug pass unnoticed.
#
# The real CRD is not vendored because it belongs to Multus, not to this project.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: network-attachment-definitions.k8s.cni.cncf.io
spec:
  group: k8s.cni.cncf.io
  scope: Namespaced
  names:
    kind: NetworkAttachmentDefinition
    listKind: NetworkAttachmentDefinitionList
    plural: network-attachment-definitions
    singular: network-attachment-definition
    shortNames:
      - net-attach-def
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                config:
                  type: string
              required:
                - config
